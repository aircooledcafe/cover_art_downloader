"$schema" = "./node_modules/wrangler/config-schema.json"
name = "cover-art-downloader"
main = "src/entry.py"
compatibility_date = "2025-09-01"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
COVER_ART_USER_AGENT = "CoverArtDownloader/1.0 ( https://github.com/aircooledcafe/cover_art_downloader )"
